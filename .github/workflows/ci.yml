name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.13.2'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libgc-dev libunwind-dev zlib1g-dev libssl-dev libcurl4-openssl-dev libidn2-dev
      - run: sbt 'app/scalafmtCheckAll; scalafmtCheckAll; scalafmtSbtCheck; integrationTest/scalafmtCheckAll; app/testFull'
      - run: tofu -chdir=terraform fmt -check
      - run: tofu -chdir=terraform init -backend=false && tofu -chdir=terraform validate
      - run: sbt integrationTest/testFull
