services:
  floci:
    image: floci/floci:2.3.0
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_SERVICES_DOCKER_NETWORK: sharaf-floci
      FLOCI_SERVICES_ECR_URI_STYLE: path

  floci-ui:
    image: floci/floci-ui:0.7.0
    ports:
      - "127.0.0.1:4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      floci:
        condition: service_healthy

networks:
  default:
    name: sharaf-floci
